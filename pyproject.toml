[project]
name = "py-agent"
version = "0.1.0"
description = "Python port of the pi agent architecture — lite coding agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=0.11.0",
    "pydantic>=2.0.0",
    "jsonschema>=4.0.0",
]

[project.scripts]
py-agent = "py_agent.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_agent"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
